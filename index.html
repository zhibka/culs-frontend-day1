<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Little Herb Garden</title>
  <link rel="icon" href="images/Logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <img class="logo" src="images/Logo.svg" alt="" width="48" height="48">
    <p class="site-name">The Little Herb Garden</p>
    <nav>
      <ul>
        <li><a href="#herbs">Herbs</a></li>
        <li><a href="#visit">Visit</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">

    <section id="herb-detail"></section>

    <section id="herbs-main"></section>

  </main>

  <footer>
    <p>Made with HTML, CSS and JavaScript.
      <a href="https://developer.mozilla.org/">MDN</a> helped.</p>
  </footer>
  <template id="visit-template">
    <section id="visit" aria-labelledby="visit-heading">
      <h2 id="visit-heading">Visit Prague's gardens</h2>
      <p>Explore four of Prague's best-known gardens, from Baroque terraces to peaceful city hideaways.</p>
      <p id="gardens-status" role="status">Loading gardens...</p>
      <ul id="gardens-list" class="cards garden-cards"></ul>
    </section>
  </template>
  <template id="garden-card-template">
    <li class="card garden-card">
      <img class="garden-image" width="640" height="420" loading="lazy">
      <div class="garden-copy">
        <p class="eyebrow garden-area"></p>
        <h3 class="garden-name"></h3>
        <p class="latin garden-local-name"></p>
        <p class="garden-description"></p>
        <a class="garden-map">View on Google Maps</a>
        <a class="garden-source">Photo &amp; visitor information: Prague City Tourism</a>
      </div>
    </li>
  </template>
</body>
</html>
